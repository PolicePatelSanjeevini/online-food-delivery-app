<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner with Zestora</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div><main class="page-wrap container py-5"><div class="row justify-content-center"><div class="col-lg-8"><p class="section-kicker">For ambitious kitchens</p><h1>Bring your restaurant to Zestora.</h1><p class="text-muted">Create your owner account and publish your first menu.</p><div id="error" class="alert alert-danger d-none"></div><form onsubmit="registerOwner(event)" class="card card-body shadow-sm"><div class="row g-3"><div class="col-md-6"><label class="form-label">Owner name</label><input class="form-control" name="ownerName" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" name="password" type="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Restaurant name</label><input class="form-control" name="restaurantName" required></div><div class="col-md-6"><label class="form-label">Cuisine type</label><input class="form-control" name="cuisineType" placeholder="Indian, Pizza, Healthy" required></div><div class="col-12"><label class="form-label">Restaurant description</label><textarea class="form-control" name="restaurantDescription" rows="2"></textarea></div><div class="col-12"><label class="form-label">Restaurant image URL</label><input class="form-control" name="restaurantImage" type="url"></div><div class="col-12"><label class="form-label">Restaurant address</label><input class="form-control" name="address" required></div></div><button class="btn btn-zest mt-4">Create owner account</button></form><p class="mt-3">Already a partner? <a href="restaurant-login.html">Owner login</a></p></div></div></main><script src="js/app.js"></script></body></html>
