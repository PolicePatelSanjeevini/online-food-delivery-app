<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurants | Zestora</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div><main><section class="hero py-5"><div class="container py-4"><p class="eyebrow">Good food is closer than you think</p><h1>Find your next favourite bite.</h1><p class="lead mt-4">Discover local kitchens, quick comfort food, and bright new flavours delivered with zest.</p></div></section><div class="container"><div class="search-panel p-3 p-md-4"><div class="row g-2"><div class="col-md-8"><input id="search" class="form-control form-control-lg border-0 bg-light" placeholder="Search restaurants or cuisine" oninput="loadRestaurants()"></div><div class="col-md-4"><select id="ratingFilter" class="form-select form-select-lg" onchange="loadRestaurants()"><option value="">Any rating</option><option value="4.5">4.5+ rated</option><option value="4.7">4.7+ rated</option></select></div></div><div class="d-flex flex-wrap gap-2 mt-3"><button class="category-chip active px-3 py-2" onclick="setCuisine('', this)">All kitchens</button><button class="category-chip px-3 py-2" onclick="setCuisine('Indian', this)">Indian</button><button class="category-chip px-3 py-2" onclick="setCuisine('Burgers', this)">Burgers</button><button class="category-chip px-3 py-2" onclick="setCuisine('Healthy', this)">Healthy</button><button class="category-chip px-3 py-2" onclick="setCuisine('Pizza', this)">Pizza</button><button class="category-chip px-3 py-2" onclick="setCuisine('Desserts', this)">Desserts</button></div></div><div class="d-flex justify-content-between align-items-end mt-5"><div><p class="section-kicker mb-2">The Zestora edit</p><h2 class="mb-0">Kitchens worth leaving home for</h2></div><span id="resultCount" class="text-muted small"></span></div><div id="error" class="alert alert-danger d-none mt-3"></div><div id="restaurants" class="row g-4 mt-2 pb-5"></div></div></main><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',loadRestaurants)</script></body></html>
