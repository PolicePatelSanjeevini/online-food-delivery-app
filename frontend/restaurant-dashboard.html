<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant dashboard | Zestora</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div><main class="container py-5"><div class="d-flex justify-content-between align-items-end gap-3 flex-wrap"><div><p class="section-kicker">Partner workspace</p><h1 id="ownerTitle">Your restaurant</h1><p class="text-muted">Manage your menu from one calm, focused view.</p></div><a href="restaurants.html" class="btn btn-outline-zest">View public listing</a></div><div id="error" class="alert alert-danger d-none"></div><div id="restaurantDetails" class="menu-hero row g-0 mt-4"></div><section class="mt-5"><div class="d-flex justify-content-between align-items-center"><h2>Menu items</h2><button class="btn btn-zest" data-bs-toggle="collapse" data-bs-target="#foodForm">Add food item +</button></div><form id="foodForm" class="collapse card card-body mt-3" onsubmit="saveFood(event)"><div class="row g-3"><div class="col-md-6"><label class="form-label">Food name</label><input class="form-control" name="name" required></div><div class="col-md-3"><label class="form-label">Price (₹)</label><input class="form-control" name="price" type="number" min="0" step="0.01" required></div><div class="col-md-3"><label class="form-label">Category</label><select class="form-select" name="categoryId" id="categoryId" required></select></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="2"></textarea></div><div class="col-md-8"><label class="form-label">Food image URL</label><input class="form-control" name="imageUrl" type="url"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check"><input class="form-check-input" name="available" type="checkbox" checked><label class="form-check-label">Available now</label></div></div></div><button class="btn btn-zest mt-3">Save food item</button></form><div id="ownerMenu" class="row g-4 mt-2"></div></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',loadOwnerDashboard)</script></body></html>
