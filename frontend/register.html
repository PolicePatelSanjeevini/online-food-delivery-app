<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Zestora</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div><main class="page-wrap container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><h1>Create account</h1><div id="error" class="alert alert-danger d-none"></div><form onsubmit="register(event)" class="card card-body shadow-sm"><input class="form-control mb-3" name="fullName" placeholder="Full name" required><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" minlength="6" placeholder="Password" required><input class="form-control mb-3" name="phone" placeholder="Phone"><button class="btn btn-dark">Register</button></form></div></div></main><script src="js/app.js"></script></body></html>
